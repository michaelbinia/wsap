services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mini_wsa
      POSTGRES_USER: mini_wsa
      POSTGRES_PASSWORD: mini_wsa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_wsa -d mini_wsa"]
      interval: 10s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/mini_wsa
      DATASOURCE_USER: mini_wsa
      DATASOURCE_PASSWORD: mini_wsa
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
