spring:
  application:
    name: mini-wsa
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/mini_wsa}
    username: ${DATASOURCE_USER:mini_wsa}
    password: ${DATASOURCE_PASSWORD:mini_wsa}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      accept-single-value-as-array: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

mini-wsa:
  stats:
    top-n: 10
  samples:
    default-limit: 20
    max-limit: 100
  scoring:
    max-score: 100
    severity:
      CRITICAL: 40
      HIGH: 30
      MEDIUM: 20
      LOW: 10
    action:
      DENY: 20
      ALERT: 10
      MONITOR: 0
    sensitive-path:
      bonus: 15
      markers:
        - /admin
        - /login
    repeat-offender:
      bonus: 15
      threshold: 5
      window: PT10M

logging:
  level:
    com.security.wsa: INFO
